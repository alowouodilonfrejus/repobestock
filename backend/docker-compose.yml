# Usage : docker compose --env-file ../env/.env up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: bestock_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?renseignez POSTGRES_PASSWORD dans env/.env}
      POSTGRES_DB: ${POSTGRES_DB:-bestock_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bestock_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bestock_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ../env/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bestock_db}
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.internal_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
